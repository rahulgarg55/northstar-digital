name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit-and-build:
    name: Lint, Test & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Clean Install Dependencies
        run: npm ci

      - name: Type Check & Production Build
        run: npm run build

      - name: Start Production Server for Audit
        run: |
          npx next start -p 3000 &
          sleep 4

      - name: Run End-to-End Regression Audit (266+ Tests)
        run: node scripts/test-whole-website.mjs

      - name: Run Load Test Validation
        run: node scripts/load-test.mjs
