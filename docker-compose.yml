services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: northstar-digital-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - AGENCY_EMAIL_FROM=${AGENCY_EMAIL_FROM:-studio@northstardigital.studio}
      - AGENCY_ADMIN_EMAILS=${AGENCY_ADMIN_EMAILS:-gargr0109@gmail.com}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
